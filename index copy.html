<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=VT323&display=swap" rel="stylesheet">
  <title>Participation Activity 3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'VT323', monospace;
    }

    body {
      background-color: #0b1426;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(151, 206, 76, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 20% 20%, rgba(0, 181, 204, 0.1) 0%, transparent 40%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .portal-bg {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #97ce4c 0%, #00b5cc 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.35;
      animation: pulse 4s infinite alternate;
      z-index: 0;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.25; }
      100% { transform: scale(1.1); opacity: 0.45; }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 3px solid #97ce4c;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(151, 206, 76, 0.4), inset 0 0 15px rgba(0, 181, 204, 0.2);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .character-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .character-header img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(151, 206, 76, 0.6));
    }

    h2 {
      font-family: 'Creepster', cursive;
      margin-bottom: 5px;
      color: #97ce4c;
      text-shadow: 2px 2px 0px #00b5cc, 0 0 10px rgba(151, 206, 76, 0.8);
      font-size: 2.2rem;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #00b5cc;
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      background: #080e1a;
      border: 2px solid #00b5cc;
      border-radius: 10px;
      font-size: 1.3rem;
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
      text-align: center;
    }

    input[type="text"]:focus {
      border-color: #97ce4c;
      box-shadow: 0 0 12px rgba(151, 206, 76, 0.6);
    }

    input[type="button"] {
      background: linear-gradient(135deg, #97ce4c 0%, #00b5cc 100%);
      color: #0b1426;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="button"]:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(151, 206, 76, 0.8);
    }

    #output {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background-color: #080e1a;
      color: #97ce4c;
      font-size: 1.3rem;
      text-align: center;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed #97ce4c;
      box-shadow: inset 0 0 10px rgba(151, 206, 76, 0.2);
    }
  </style>
</head>
<body>

  <div class="portal-bg"></div>

  <div class="card">
    <div class="character-header">
      <img src="https://raw.githubusercontent.com/afonsopacifer/rick-and-morty-svg/master/svg/rick.svg" alt="Rick Sanchez">
      <img src="https://raw.githubusercontent.com/afonsopacifer/rick-and-morty-svg/master/svg/morty.svg" alt="Morty Smith">
    </div>
    <h2>Dimension Finder</h2>
    <p class="subtitle">Enter Dimension / Country</p>
    <form>
      <input type="text" id="input1" placeholder="Enter the country">
      <input type="button" py-click="countries_capital" value="output">
    </form> 
    <div id="output">Result will appear here...</div>
  </div>

  <py-script src="main.py"></py-script>

</body>
</html>
